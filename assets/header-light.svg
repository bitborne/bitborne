<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Schatten — AI Infrastructure and Systems</title>
  <desc id="desc">Animated light banner connecting vLLM, Mooncake, storage, and the Linux data path.</desc>
  <style>
    .dash { stroke-dasharray: 9 12; animation: dash 7s linear infinite; }
    .blink { animation: blink 1.1s step-end infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.6s ease-out infinite; }
    .pulse.delay { animation-delay: 1.3s; }
    @keyframes dash { to { stroke-dashoffset: -84; } }
    @keyframes blink { 50% { opacity: .18; } }
    @keyframes pulse { 0% { transform: scale(.7); opacity: .65; } 100% { transform: scale(2.1); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .dash, .blink, .pulse { animation: none; } .moving { display: none; } }
  </style>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#dce5ec" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="358" rx="18" fill="#f6f9fb" stroke="#b9c7d2" stroke-width="2"/>
  <rect x="24" y="24" width="1152" height="312" rx="10" fill="url(#grid)" stroke="#dce5ec"/>
  <path d="M42 64H1158M42 302H1158" stroke="#cbd7e0"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="48" y="48" fill="#627282" font-size="11" letter-spacing="2.4">NODE / BITBORNE</text>
    <circle cx="1090" cy="44" r="4" fill="#168648" filter="url(#glow)"/>
    <text x="1103" y="48" fill="#627282" font-size="11" letter-spacing="1.5">ONLINE</text>

    <text x="62" y="139" fill="#16212b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="58" font-weight="750" letter-spacing="-1.8">SCHATTEN</text>
    <text x="65" y="179" fill="#168648" font-size="16" font-weight="700" letter-spacing="2.6">AI INFRASTRUCTURE / SYSTEMS</text>
    <text x="65" y="218" fill="#536575" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">KV Cache Connector · Mooncake Store · native systems</text>
    <text x="65" y="260" fill="#087aa8" font-size="13">$ trace --from logical-cache --to memory-path</text>
    <rect class="blink" x="478" y="247" width="8" height="17" rx="1" fill="#087aa8"/>

    <g transform="translate(665 88)">
      <path class="dash" d="M58 55C118 15 179 15 238 55S356 94 416 54" fill="none" stroke="#78a9bd" stroke-width="2"/>
      <path class="dash" d="M58 135C118 175 179 175 238 135S356 96 416 136" fill="none" stroke="#74a884" stroke-width="2"/>

      <g transform="translate(24 95)">
        <circle class="pulse" r="24" fill="none" stroke="#087aa8" stroke-width="2"/>
        <circle r="25" fill="#e8f5fb" stroke="#087aa8" stroke-width="2"/>
        <circle r="6" fill="#087aa8"/>
        <text x="-17" y="48" fill="#075e80" font-size="12">vLLM</text>
      </g>
      <g transform="translate(238 95)">
        <circle class="pulse delay" r="31" fill="none" stroke="#168648" stroke-width="2"/>
        <circle r="34" fill="#e8f7ed" stroke="#168648" stroke-width="2"/>
        <circle r="8" fill="#168648"/>
        <text x="-45" y="58" fill="#116737" font-size="12">KV CONNECTOR</text>
      </g>
      <g transform="translate(452 95)">
        <circle r="25" fill="#fff7dc" stroke="#a87500" stroke-width="2"/>
        <circle r="6" fill="#a87500"/>
        <text x="-50" y="48" fill="#795600" font-size="12">MOONCAKE STORE</text>
      </g>

      <g class="moving" fill="#16212b">
        <circle r="3"><animateMotion dur="3.2s" repeatCount="indefinite" path="M58 55C118 15 179 15 238 55S356 94 416 54"/></circle>
        <circle r="3"><animateMotion dur="4.1s" begin="-1.6s" repeatCount="indefinite" path="M58 135C118 175 179 175 238 135S356 96 416 136"/></circle>
      </g>
    </g>

    <text x="48" y="326" fill="#627282" font-size="11" letter-spacing="1.5">C / C++ / PYTHON</text>
    <text x="890" y="326" fill="#627282" font-size="11" letter-spacing="1.5">OPEN SOURCE DATA PATH</text>
  </g>
</svg>
