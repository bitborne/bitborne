<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">vLLM and Mooncake open-source contribution path</title>
  <desc id="desc">Animated data flow between the vLLM KV Cache Connector and Mooncake Store.</desc>
  <style>
    .flow { stroke-dasharray: 9 12; animation: flow 5s linear infinite; }
    .pulse { animation: pulse 2.2s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -84; } }
    @keyframes pulse { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } .packet { display: none; } }
  </style>
  <rect x="1" y="1" width="1198" height="218" rx="14" fill="#f6f9fb" stroke="#b9c7d2" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="36" y="35" fill="#627282" font-size="11" letter-spacing="2">OPEN SOURCE / INFERENCE INFRASTRUCTURE</text>
    <path d="M260 110H940" stroke="#dce5ec" stroke-width="12"/>
    <path class="flow" d="M260 110H940" stroke="#78a9bd" stroke-width="2" fill="none"/>

    <g transform="translate(235 110)">
      <circle r="48" fill="#e8f5fb" stroke="#087aa8" stroke-width="2"/>
      <circle class="pulse" r="10" fill="#087aa8"/>
      <text x="-18" y="76" fill="#075e80" font-size="15">vLLM</text>
      <text x="-70" y="99" fill="#627282" font-size="11">KV CACHE CONNECTOR</text>
    </g>

    <g transform="translate(600 110)">
      <circle r="28" fill="#eef3f6" stroke="#7890a2" stroke-width="2"/>
      <path d="M-10 0H10M3-7L10 0 3 7" stroke="#536575" stroke-width="2" fill="none"/>
      <text x="-38" y="55" fill="#627282" font-size="10">DATA FLOW</text>
    </g>

    <g transform="translate(965 110)">
      <circle r="48" fill="#e8f7ed" stroke="#168648" stroke-width="2"/>
      <circle class="pulse" r="10" fill="#168648"/>
      <text x="-36" y="76" fill="#116737" font-size="15">MOONCAKE</text>
      <text x="-49" y="99" fill="#627282" font-size="11">MOONCAKE STORE</text>
    </g>

    <g class="packet" fill="#16212b">
      <circle r="3"><animateMotion dur="3.4s" repeatCount="indefinite" path="M260 110H940"/></circle>
      <circle r="3"><animateMotion dur="3.4s" begin="-1.7s" repeatCount="indefinite" path="M940 110H260"/></circle>
    </g>
  </g>
</svg>
